<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Elaiza ❤️</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #fce4ec;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            max-width: 450px;
            width: 90%;
            z-index: 5;
            /* Ensures the card height doesn't jump */
            min-height: 550px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .video-container {
            width: 100%;
            height: 250px; /* Fixed height to keep card stable */
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff; /* Optional: matches card bg */
        }

        img {
            max-width: 100%;
            max-height: 100%;
            display: block;
            border-radius: 15px;
            /* This keeps the image ratio without stretching */
            object-fit: contain; 
        }

        h1 {
            color: #444;
            font-size: 1.1rem;
            margin-bottom: 25px;
            min-height: 60px;
        }

        .btn-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 220px; 
            width: 100%;
        }

        #yesBtn {
            background-color: #e91e63;
            color: white;
            padding: 15px 35px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
            z-index: 10;
        }

        #noBtn {
            background-color: #999;
            color: white;
            width: 80px;
            height: 45px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            position: absolute;
            z-index: 1000; 
            bottom: 20px;
            right: 20px;
            transition: 0.1s ease-out;
            transform: scale(1) !important;
        }

        .success { display: none; text-align: center; }
        .success h1 { color: #e91e63; font-size: 2rem; }

        .heart {
            position: absolute;
            color: #e91e63;
            font-size: 20px;
            user-select: none;
            animation: float 4s linear infinite;
            z-index: 1;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="happyMusic" loop>
        <source src="https://www.myinstants.com/media/sounds/happy-happy-happy-cat.mp3" type="audio/mpeg">
    </audio>

    <div id="main-content">
        <div id="card">
            <div class="video-container">
                <img id="mainGif" src="https://media1.giphy.com/media/v1.Y2lkPTZjMDliOTUybnppbnk0cXB5d2Y3YXZlOGNwY2tldm44eXQ1OGh2Y3ppbXV1dWlrZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/OgY9PFIPQXHyRQ8LIJ/giphy.gif" alt="Asking cat">
            </div>
            <h1 id="questionText">Elaiza, will you be my Valentine?</h1>
            <div class="btn-container" id="boundary">
                <button id="yesBtn">YES</button>
                <button id="noBtn">No</button>
            </div>
        </div>
    </div>

    <div id="success-screen" class="success">
        <div id="card">
            <div class="video-container">
                <img src="https://media3.giphy.com/media/v1.Y2lkPTZjMDliOTUydzVvbXpuc241bXBxejR2YjBsaDczZmlobDNqNmM5Nzg4NHlpc3ZlZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/C8ih1zB9e9KJLySClx/giphy.gif" alt="Happy Happy Happy">
            </div>
            <h1>YAY! BEST DAY EVER! ❤️🎉</h1>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const boundary = document.getElementById('boundary');
        const mainContent = document.getElementById('main-content');
        const successScreen = document.getElementById('success-screen');
        const questionText = document.getElementById('questionText');
        const mainGif = document.getElementById('mainGif');
        const music = document.getElementById('happyMusic');

        let scale = 1;
        let noCount = 0;

        const sadGifs = [
            "https://media3.giphy.com/media/v1.Y2lkPTZjMDliOTUya2NyYnp2NHZrOTI0ZnF3M2RlcGEyanQwa3F5NWFsdnNsMXhzYzd5OCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/TZBED1pP5m8N2/giphy.gif",
            "https://media3.giphy.com/media/v1.Y2lkPTZjMDliOTUyeHh4bncxNGJtdGFwZ2N0cGhnd2VsM2JtNWczeGhrOGp3bzNmOXp0MCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/aWMJvA76tNnBR9gkpT/giphy.gif",
            "https://media3.giphy.com/media/v1.Y2lkPTZjMDliOTUyY2E0OHdwcnQ1aXljODZwZ28yZjEyZnV2eHl2MTc0OXN3bnVyMnRubSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/ruyS8Zw9sBqE5UjOnY/giphy.gif",
            "https://media2.giphy.com/media/v1.Y2lkPTZjMDliOTUycHppbmtreHNjbGg4NmhwZnllc29jZzdtNGZ4cHFhNHpwbmM4a25mYyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/r2kzXQhvqRdlCIp5CW/giphy.gif",
            "https://media2.giphy.com/media/v1.Y2lkPTZjMDliOTUya3A2bHE4ZW8wdzB2a3lkYmtpM3lhMGtlajNtNmRzMXhxOWQ4cWJtbiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/7AzEXdIb1wyCTWJntb/giphy.gif",
            "https://media2.giphy.com/media/v1.Y2lkPTZjMDliOTUyaWhlcm1zcXFsNnNwNWRrYnRoaG1iaXIybG04YWRyMHp2dWloYTNxbyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/mi4ec226vjAkehSLk0/giphy.gif",
            "https://media4.giphy.com/media/v1.Y2lkPTZjMDliOTUyZ3RqYWwweWl2cnV6MWg3bHkwYTAydHh4dWF5eTEwZm1hZ2dpc21mZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/OBNZCbTy1s8u8i7Wre/giphy.gif",
            "https://media1.giphy.com/media/v1.Y2lkPTZjMDliOTUyc2RuajNxN2d1aXFoaXR6Y2Y5MnBlNXo0djdiMXVjdmNiNzU4YW1vMiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/CM1rHbKDMH2BW/giphy.gif"
        ];

        const messages = [
            "Why press no? 😔😔",
            "Babbb pislita ang yes please! 🥺🥺",
            "Are you sure?? 💔💔💔",
            "huna hunaa ug maayo pls... 🥹🥹", 
            "Don't do this to me! 😭😭😭",
            "aym so sad right now... 😞😞😞",
            "You're breaking my heart baby 😓",
            "bad na kaau ka babi ha! 😤😤",
            "hilak nako ron... 😔😔",
            "sige lang kapoyon raka sige gukod sa no button! 😝😝",
            "bisag kausa lang babb... pislita ang yes 🥺🙏",
            "Pislita ang DAKO right now!!!!",
            "hala sige... i-no pa jud! 🙄🙄",
            "last chance na ni babbb... 🌹🌹",
            "isumbong tika sa imong mama ron!! 🤣 jk",
            "YES na pleaseeee! 💖💖💖"
        ];

        function moveNoButton() {
            const containerWidth = boundary.offsetWidth;
            const containerHeight = boundary.offsetHeight;
            let randomX = Math.random() * (containerWidth - noBtn.offsetWidth);
            let randomY = Math.random() * (containerHeight - noBtn.offsetHeight);

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
            
            // Sequential GIF swap
            mainGif.src = sadGifs[noCount % sadGifs.length];

            noCount++;
            scale += 0.15;
            yesBtn.style.transform = `scale(${scale})`;

            if (noCount <= messages.length) {
                questionText.innerText = messages[noCount - 1];
            }

            if (noCount >= 20) {
                yesBtn.style.position = 'fixed';
                yesBtn.style.top = '0';
                yesBtn.style.left = '0';
                yesBtn.style.width = '100vw';
                yesBtn.style.height = '100vh';
                yesBtn.style.zIndex = '9999';
                yesBtn.style.borderRadius = '0';
                yesBtn.style.display = 'flex';
                yesBtn.style.justifyContent = 'center';
                yesBtn.style.alignItems = 'center';
                yesBtn.style.fontSize = '2.5rem';
                yesBtn.innerText = "CLICK YES BABII PLEASE 🥹🙏";
                noBtn.style.display = 'none';
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 4000);
        }

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        yesBtn.addEventListener('click', () => {
            mainContent.style.display = 'none';
            successScreen.style.display = 'block';
            document.body.style.backgroundColor = '#ff80ab';
            music.play();
            setInterval(createHeart, 300); 
        });
    </script>
</body>
</html>
